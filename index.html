<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ordem Paranormal: Reexistência</title>
<script src="nav.js"></script>
<style>
html{color-scheme:light dark}
body{margin:0;background:var(--bg,#e5e8e3);color:var(--ink,#182225);font:17px/1.6 Georgia,serif;min-height:100vh}
main{max-width:980px;margin:0 auto;padding:clamp(30px,7vh,80px) 24px 60px}
#inicio-dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
a.big{display:flex;flex-direction:column;gap:6px;background:var(--card);color:var(--ink);text-decoration:none;padding:22px 22px 20px;border:1px solid var(--line);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%);transition:transform .3s}
a.big .vdado{width:64px;height:64px;color:var(--teal);margin-bottom:8px}
a.big strong{font:400 28px/1.1 var(--f-d)}
a.big span{color:var(--muted);font-size:15.5px}
a.big kbd{margin-top:8px;font:500 12px var(--f-n);color:var(--muted)}
a.big:hover,a.big:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
a.big:hover .vdado{transform:rotate(18deg)}
.dica{margin-top:26px;color:var(--muted);font-size:14.5px}

.capa{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:38px}
.capa .sigilo{width:min(46vw,250px);height:auto;margin-bottom:26px;color:var(--teal)}
.capa .anel{fill:none;stroke:currentColor;stroke-width:1.2}.capa .fino{stroke-width:.6;opacity:.55}.capa .nucleo{fill:currentColor}
.capa .selo{font:500 15px var(--f-b);color:var(--muted);margin:0 0 6px;letter-spacing:.02em}
.capa h1{margin:0;font:400 clamp(48px,10vw,110px)/.95 var(--f-d);letter-spacing:-.02em;color:var(--ink)}
.capa .lema{margin:18px 0 0;max-width:44ch;color:var(--muted);font-size:19px;font-style:italic}
</style></head><body>
<main>
<header class="capa">
<svg class="sigilo" viewBox="0 0 200 200" role="img" aria-label="Símbolo: um anel rompido que se refaz ao redor de um núcleo"><circle class="anel fino" cx="100" cy="100" r="94"/><path class="anel" d="M100 14a86 86 0 1 1-60.8 25.2" stroke-linecap="round"/><path class="anel" d="M58 100a42 42 0 0 1 84 0" stroke-linecap="round"/><path class="anel" d="M142 100a42 42 0 0 1-84 0" stroke-dasharray="3 7" stroke-linecap="round"/><path class="anel fino" d="M100 6v32M100 162v32M6 100h32M162 100h32"/><path class="anel" d="M100 74l17 26-17 26-17-26z"/><circle class="nucleo" cx="100" cy="100" r="5"/><circle class="nucleo" cx="39.2" cy="39.2" r="3.5"/></svg>
<p class="selo">Ordem Paranormal</p>
<h1>Reexistência</h1>
<p class="lema">Um sistema provisório construído sobre o Playtest Alpha. Escolha por onde começar.</p>
</header>
<div id="inicio-dados"></div>
<p class="dica">Dentro de cada parte, o trilho de dados à esquerda troca de página. Atalhos: Alt+1, Alt+2, Alt+3 e Alt+0 (início). Alt+P troca a paleta.</p>
</main>
</body></html>
